<header><div class="eyebrow">我的播客 / WP-05 / 交互与文案关卡</div><h1>先把收听路径理顺</h1><p class="notice">左侧为真实模拟器截图或明确缺失的基线；右侧为可点击的<strong>交互效果稿</strong>。本轮加入暖色与少量蓝绿强调色，按钮保留原界面的圆润形态和按压反馈；最终视觉与图标仍将在下一关比较。线框中的节目名、时间和文字稿均为演示数据；不读取文件，不删除实际文件，不连接服务器。</p><div class="flow">节目 → 分类 / 搜索 → 点标题看详情，点播放键直接听　·　底部固定：节目 / 待播 / 设置　·　迷你播放器位于导航上方</div></header>

{id:2,title:'节目、简介与分类',image:'current-programme.png',caption:'本轮真实模拟器截图 · v1.0.1-preview / API 35 · 节目简介、分类与剧集列表。',note:'简介默认两行，主动展开；分类为包内文件夹生成的横向筛选，标题搜索留在剧集列表。分类示例不代表固定题材。'},
{id:3,title:'剧集详情与直接播放',image:'current-episode-modal.png',caption:'本轮真实截图 · 现状点击剧集首先进入三按钮弹窗。',note:'拆开两种意图：点行内播放键直接播放；点标题进入详情。详情页保留全文文字稿、分类与原有剧集信息。本地合成排序日期不展示，真实 RSS 发行日期仍保留。'},
{id:4,title:'迷你播放器与完整播放器',image:'current-player.png',caption:'本轮真实完整播放器截图 · v1.0.1-preview / API 35 · 原生倍速、睡眠、快退/快进与下一集；迷你态另见首页基线。',note:'迷你态始终贴在三栏导航上方；点封面/标题展开完整播放器。倍速和睡眠定时为主动打开的底部面板，保留原能力。当前真实播放器的 Jan 1, 2000 是内部排序日期；计划仅对导入节目隐藏，保留 RSS 真日期。',controls:'<button data-act="player-mini">迷你态</button><button data-act="player-full">完整态</button>'},
{id:5,title:'文字稿与查找',image:'historical-transcript.png',caption:'真实历史截图 · 2026-11-10 11:28 · 首版 1.0.0-kitchen · API 35。包含真实导入文字稿，未重构截图。',note:'全文以阅读为主；搜索工具主动打开，显示当前匹配/总数，支持上一处、下一处，退出搜索恢复阅读。'},
{id:6,title:'导入进度与当次完成',image:'current-startup.png',caption:'本轮真实截图 · v1.0.1-preview / API 35 · 打开应用自动出现历史“导入结果”；当前记录只有 OK，无删除按钮。',note:'成功不弹窗；当次操作在页面内完成。再次启动只恢复节目与播放状态，不重新打开历史报告。部分成功、失败、取消各有明确后续。',controls:'<button data-import="idle">选择前</button><button data-import="progress">进行中</button><button data-import="success">成功</button><button data-import="partial">部分成功</button><button data-import="failure">失败</button><button data-import="cancel">取消</button>'},

{id:8,title:'待播、设置与 RSS 次级入口',image:'current-queue.png',caption:'本轮真实待播截图 · v1.0.1-preview / API 35 · 设置基线另见下面补充截图；原 RSS 能力保留。',note:'底栏固定“节目 / 待播 / 设置”，不混入英文首页、收件箱与更多。RSS 订阅、搜索、下载、同步仍可从设置内的 RSS 入口访问。常用入口统一中文；关于页展示准确上游归属/许可/源码，替换仅按包名触发的误导警告，不删除版权或 LICENSE。',controls:'<button data-nav="queue">待播</button><button data-nav="settings">设置</button><button data-nav="rss">RSS</button>'}
];
let state={empty:false,category:'全部',description:false,query:'',playing:false,playerFull:true,speed:'1.0',sleep:'关闭',transcriptSearch:true,keyword:'Muse',match:0,import:'success',progress:12,issues:false,source:'exists',nav:'queue',queue:['示例剧集 02','示例剧集 03','示例剧集 04'],removed:null};

const episodes=[{n:'01',title:'第一集 · 示例标题',cat:'基础',time:'5:20',progress:35},{n:'02',title:'第二集 · 示例标题',cat:'基础',time:'6:10',progress:0},{n:'A1',title:'延伸一 · 示例标题',cat:'延伸',time:'4:50',progress:0}];

const mini=()=>`<div class="miniplayer"><span class="cover small"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h2v6H3zm4-4h2v14H7zm4 2h2v10h-2zm4-4h2v18h-2zm4 5h2v8h-2z"/></svg></span><div class="grow" role="button" tabindex="0" data-go="4"><b>第一集 · 示例标题</b><div class="muted">声音笔记 · ${state.playing?'正在播放':'已暂停'}</div></div><button data-act="toggle-play" aria-label="${state.playing?'暂停':'播放'}">${state.playing?`<svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>`:`<svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8c0-.8.9-1.3 1.6-.9l12 7.2c.7.4.7 1.4 0 1.8l-12 7.2c-.7.4-1.6-.1-1.6-.9z"/></svg>`}</button></div>`;
const head=(title,action='')=>`<div class="phonehead"><strong>${title}</strong>${action}</div>`;
const shell=(content,active='library',showMini=true)=>`<div class="statusbar"><span>9:41</span><span>●●● ▰</span></div>${content}${showMini?mini():''}${tabbar(active)}`;
function programmeRows(){return episodes.filter(e=>(state.category==='全部'||e.cat===state.category)&&(e.title+e.n).includes(state.query)).map(e=>`<div class="row"><div class="cover small"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h2v6H3zm4-4h2v14H7zm4 2h2v10h-2zm4-4h2v18h-2zm4 5h2v8h-2z"/></svg></div><div class="grow"><button class="titlebutton" data-go="3">${e.n} ${e.title}</button><div class="muted">${e.cat} · ${e.time}</div><div class="line"><i style="width:${e.progress}%"></i></div></div><button data-act="play" aria-label="播放${e.n}"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8c0-.8.9-1.3 1.6-.9l12 7.2c.7.4.7 1.4 0 1.8l-12 7.2c-.7.4-1.6-.1-1.6-.9z"/></svg></button></div>`).join('')||'<p class="muted">没有找到匹配的剧集。</p>'}

if(id===2)return shell(head('声音笔记','<button data-go="1">全部节目</button>')+`<div class="content"><div class="row"><span class="cover"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h2v6H3zm4-4h2v14H7zm4 2h2v10h-2zm4-4h2v18h-2zm4 5h2v8h-2z"/></svg></span><div><b>声音笔记</b><span class="muted">26 集 · 已下载到本机</span></div></div><p class="muted">每一集一个主题，按照自己的节奏慢慢听。${state.description?'这里展开完整节目简介，保持用户原始内容，不作为界面文案压缩。':''} <button data-act="description">${state.description?'收起':'展开'}</button></p><div class="chips">${['全部','基础','延伸'].map(c=>`<button class="${state.category===c?'active':''}" data-cat="${c}">${c}</button>`).join('')}</div><input class="search" aria-label="搜索标题" placeholder="搜索标题" value="${escapeHtml(state.query)}" data-input="episode-search"><div id="programmeRows">${programmeRows()}</div></div>`);

if(id===4)return shell(head(state.playerFull?'正在播放':'节目','<button data-act="player-mini">收起</button>')+`<div class="content">${state.playerFull?`<div class="bigcover"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h2v6H3zm4-4h2v14H7zm4 2h2v10h-2zm4-4h2v18h-2zm4 5h2v8h-2z"/></svg></div><h2 style="font-size:22px">第一集 · 示例标题</h2><p class="muted">声音笔记</p><input type="range" aria-label="播放进度" min="0" max="320" value="112" data-input="seek"><div class="muted" style="display:flex;justify-content:space-between"><span>1:52</span><span>5:20</span></div><div class="paired transport" style="margin:24px 0"><button data-act="seek-back"><span class="skip-icon">↶</span>10 秒</button><button class="primary" data-act="toggle-play" aria-label="${state.playing?'暂停':'播放'}">${state.playing?`<svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>`:`<svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8c0-.8.9-1.3 1.6-.9l12 7.2c.7.4.7 1.4 0 1.8l-12 7.2c-.7.4-1.6-.1-1.6-.9z"/></svg>`}</button><button data-act="seek-forward"><span class="skip-icon">↷</span>30 秒</button></div><div class="paired"><label class="muted">倍速<select aria-label="倍速" data-select="speed">${['1.0','1.25','1.5','2.0'].map(v=>`<option ${state.speed===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="muted">睡眠定时<select aria-label="睡眠定时" data-select="sleep">${['关闭','15分钟','30分钟','本集结束'].map(v=>`<option ${state.sleep===v?'selected':''}>${v}</option>`).join('')}</select></label></div><button class="wide" style="margin-top:14px" data-go="5">文字稿</button>`:'<p class="muted">这是迷你播放器态。点底部封面或标题展开；切换节目、待播、设置时位置不变。</p><button data-act="player-full">展开播放器</button>'}</div>`,'library',!state.playerFull);
if(id===5){let body='Muse: 这里是文字稿阅读示例。\nAlex: 可以在全文里查找吗？\nMuse: 输入关键词，再用上一处和下一处跳转。\nAlex: 说话人标签与原始全文会保留。';let count=0;const needle=state.keyword.trim();if(needle){const parts=body.split(needle);count=parts.length-1;body=parts.map((part,i)=>escapeHtml(part)+(i<count?'<mark'+(i===state.match%count?' class="current"':'')+'>'+escapeHtml(needle)+'</mark>':'')).join('')}else body=escapeHtml(body);return shell(head('文字稿',`<button data-act="transcript-search">${state.transcriptSearch?'完成':'搜索'}</button>`)+`<div class="content">${state.transcriptSearch?`<input class="search" aria-label="查找文字稿" placeholder="查找文字稿" data-input="transcript-search" value="${escapeHtml(state.keyword)}"><div class="paired" style="margin-top:8px"><button data-act="prev-match">上一处</button><span class="match">${count?state.match%count+1:0} / ${count}</span><button data-act="next-match">下一处</button></div>`:''}<p class="muted">线框示例文字，不是原稿截图。</p><div class="copy">${body}</div></div>`)}
if(id===6){let panel='';if(state.import==='idle')panel='<div class="empty"><strong>导入播客</strong><p class="muted">选择一个 ZIP。</p><button class="primary wide" data-import="progress">选择压缩包（模拟）</button></div>';if(state.import==='progress')panel=`<h2>正在导入</h2><p>声音笔记.zip</p><p class="muted">${state.progress} / 26 集</p><div class="line" style="height:6px"><i style="width:${state.progress/26*100}%"></i></div><input type="range" min="0" max="26" value="${state.progress}" data-input="import-progress" aria-label="模拟导入进度"><p class="muted">可离开此页，导入会继续。</p><div class="paired"><button data-import="cancel">取消</button><button data-import="success">模拟完成</button></div>`;if(state.import==='success')panel='<h2>已导入 26 集</h2><p class="muted">声音笔记已加入节目。</p><button class="primary wide" data-go="2">打开节目</button><button class="wide" style="margin-top:10px" data-go="7">查看导入记录</button>';if(state.import==='partial')panel=`<h2>已导入 24 集</h2><p class="muted">2 集需要处理。</p><button class="primary wide" data-go="2">打开节目</button><button class="wide" style="margin-top:10px" data-act="issues">${state.issues?'收起问题':'查看 2 个问题'}</button>${state.issues?'<ul class="note-list"><li>第 03 集：缺少音频。</li><li>第 12 集：音频无法读取。<br>修复压缩包后重新导入。</li></ul>':''}`;if(state.import==='failure')panel='<h2>未能导入</h2><p>压缩包无法读取。</p><p class="muted">已有节目和收听进度保留。</p><button class="primary wide" data-import="idle">重新选择</button>';if(state.import==='cancel')panel='<h2>已取消</h2><p class="muted">已有节目和进度保留。</p><button class="primary wide" data-import="idle">重新导入</button>';return shell(head('导入播客','<button data-go="1">返回</button>')+`<div class="content">${panel}<div class="panel"><button class="wide" data-act="reopen">模拟再次打开应用</button><p class="muted">此按钮返回节目首页，不自动弹出历史报告。</p></div></div>`)}
if(id===7){let sourceText={exists:'原压缩包仍在文件夹中。',confirm:'原压缩包仍在文件夹中。',deleted:'原文件已删除',missing:'原文件已不存在',error:'未能删除，原文件仍保留。'}[state.source];return shell(head('导入记录','<button data-nav="settings">设置</button>')+`<div class="content"><div class="row"><div class="grow"><b>声音笔记.zip</b><span class="muted">今天 · 导入 26 集</span></div><span class="tag">完成</span></div><details open><summary>导入详情</summary><p class="muted">26 集 · 5 个分类<br>音频、封面、文字稿已保存到本机。</p></details><h3>原压缩包</h3><p>${sourceText}</p>${['exists','confirm','error'].includes(state.source)?`<button class="danger wide" data-source="confirm">${state.source==='error'?'重新尝试删除':'删除原压缩包'}</button>`:'<p class="muted">已导入的节目不受影响。</p>'}<button class="wide" style="margin-top:22px" data-act="reopen">模拟再次打开应用</button><p class="muted">“已删除 / 已不存在”在此原型本地保存；不删除任何实际文件。</p></div>${state.source==='confirm'?'<div class="overlay"><div class="modal"><h3>删除原压缩包？</h3><p>已导入的节目会保留。原 ZIP 删除后无法撤销。</p><div class="paired"><button data-source="exists">取消</button><button class="danger" data-source="deleted">删除原文件</button></div></div></div>':''}`,'settings')}
if(id===8){let content='';if(state.nav==='queue')content=`${head('待播')}<div class="content">${state.queue.map((q,i)=>`<div class="row"><span class="cover small"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h2v6H3zm4-4h2v14H7zm4 2h2v10h-2zm4-4h2v18h-2zm4 5h2v8h-2z"/></svg></span><div class="grow"><b>${escapeHtml(q)}</b><span class="muted">声音笔记 · 5:20</span></div><button data-up="${i}" aria-label="上移">↑</button><button data-remove="${i}" aria-label="移出待播">−</button></div>`).join('')}${state.removed?'<div class="panel">已移出待播　<button data-act="undo-queue">撤销</button></div>':''}<p class="muted">移出待播不会删除剧集文件。</p></div>`;if(state.nav==='settings')content=`${head('设置')}<div class="content"><div class="sectiontitle">收听</div><div class="row"><b class="grow">播放与睡眠</b><button data-go="4">›</button></div><div class="row"><b class="grow">外观与文字</b><button data-act="appearance-note">›</button></div><div class="sectiontitle">本机内容</div><div class="row"><b class="grow">导入记录</b><button data-go="7">›</button></div><div class="row"><b class="grow">RSS 订阅</b><button data-nav="rss">›</button></div><div class="sectiontitle">应用</div><div class="row"><b class="grow">关于与开源许可</b><button data-act="about">›</button></div><p class="muted">我的播客 · 本机收听</p><details><summary>关于与开源许可（计划内容）</summary><p class="muted">基于 AntennaPod，保留原作者版权。GPL-3.0。对应版本完整源码与许可证可从此入口查看。</p><p class="muted">不会仅因应用包名不同，就指称开发者违反许可证。</p></details></div>`;if(state.nav==='rss')content=`${head('RSS 订阅','<button data-nav="settings">返回</button>')}<div class="content"><input class="search" placeholder="搜索播客或输入 RSS 地址" aria-label="搜索 RSS"><div class="row"><b class="grow">我的订阅</b><button data-act="rss-note">›</button></div><div class="row"><b class="grow">下载</b><button data-act="rss-note">›</button></div><div class="row"><b class="grow">同步设置</b><button data-act="rss-note">›</button></div><p class="muted">保留原有 RSS 能力；不自动注册、登录或同步。</p></div>`;return shell(content,state.nav==='queue'?'queue':'settings')}
}
function render(){document.querySelector('.nav').innerHTML=boards.map(b=>`<a href="#board${b.id}">${b.id}. ${b.title}</a>`).join('');document.getElementById('boards').innerHTML=boards.map(b=>`<section class="board" id="board${b.id}"><div class="eyebrow">BOARD ${String(b.id).padStart(2,'0')}</div><h2>${b.title}</h2><p>${b.note}</p><div class="columns"><div class="pane"><div class="label">左 / 真实基线截图</div><div class="real"><img src="screenshots/${b.image}" alt="${b.title}真实基线" onerror="this.parentElement.innerHTML='<div class=&quot;missing&quot;>此页面的真实基线尚未捕获。<br>不使用重绘图替代真实截图。</div>'"></div><p class="caption">${b.caption}</p></div><div class="pane"><div class="label">右 / 交互效果稿 · 可点击 · 不是 App 截图</div>${b.controls?`<div class="controls">${b.controls}</div>`:''}<div class="phone" id="phone${b.id}">${wire(b.id)}</div></div></div><div class="review-note"><label class="check"><input type="checkbox"> 结构与文字可按此方向继续</label>　<label class="check"><input type="checkbox"> 这页需要修改</label></div></section>`).join('')+`<section class="board"><h2>基线说明与审阅范围</h2><p>截图清单和捕获时间见 <a href="baseline-captures.md">baseline-captures.md</a>；逐项删改见 <a href="copy-changes.md">copy-changes.md</a>；已确认守则见 <a href="approved-rules.md">approved-rules.md</a>。缺失页面不计为已验证。历史节目正文只存在于真实截图证据，不进入界面文案统计。</p><details><summary>补充真实基线：常用设置</summary><div class="real"><img src="screenshots/current-settings.png" alt="当前常用设置真实截图" onerror="this.parentElement.textContent='常用设置基线尚未捕获，不计作已验证。'"></div></details><details><summary>补充真实基线：应用名称与图标</summary><div class="real"><img src="screenshots/historical-app-info.png" alt="2026-11-10 通用品牌升级后系统应用信息真实截图"></div><p class="caption">历史截图 · 2026-11-10 20:11 · v1.0.1-preview · 通用品牌升级后的系统应用信息。</p></details><p>本稿尚未实现应用改动。下一关是视觉方向与图标比较，最终正式版包名、独立签名与 Release 构建另行落地。</p><button data-act="reset">重置线框演示状态</button></section><footer>离线单文件交互 + 相对路径图片。没有外部字体、库或网络请求。复选框仅便于审阅，不会提交任何反馈。</footer>`}
function refresh(ids=[1,2,3,4,5,6,7,8]){ids.forEach(id=>{const phone=document.getElementById('phone'+id);if(phone)phone.innerHTML=wire(id)})}
function toast(message){const e=document.getElementById('toast');e.textContent=message;e.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.add('hidden'),2400)}
function go(id){if(id===4)state.playerFull=true;refresh();document.getElementById('board'+id).scrollIntoView({behavior:'auto',block:'start'})}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.go){go(Number(b.dataset.go));return}if(b.dataset.cat){state.category=b.dataset.cat;refresh([2]);return}if(b.dataset.import){state.import=b.dataset.import;refresh([6]);return}if(b.dataset.source){state.source=b.dataset.source;try{if(['deleted','missing'].includes(state.source))localStorage.setItem('mypodcasts-wireframe-source',state.source);else localStorage.removeItem('mypodcasts-wireframe-source')}catch(e){}refresh([7]);return}if(b.dataset.nav){state.nav=b.dataset.nav;go(8);return}if(b.dataset.remove!==undefined){const i=Number(b.dataset.remove);state.removed={name:state.queue.splice(i,1)[0],index:i};refresh([8]);return}if(b.dataset.up!==undefined){const i=Number(b.dataset.up);if(i>0)[state.queue[i-1],state.queue[i]]=[state.queue[i],state.queue[i-1]];refresh([8]);return}switch(b.dataset.act){case'library-filled':state.empty=false;break;case'library-empty':state.empty=true;break;case'description':state.description=!state.description;break;case'play':state.playing=true;toast('已开始播放（原型演示）');break;case'toggle-play':state.playing=!state.playing;break;case'add-queue':if(!state.queue.includes('第一集 · 示例标题'))state.queue.push('第一集 · 示例标题');toast('已加入待播（原型演示）');break;case'player-mini':state.playerFull=false;refresh([4]);return;case'player-full':state.playerFull=true;break;case'transcript-search':state.transcriptSearch=!state.transcriptSearch;break;case'next-match':state.match++;break;case'prev-match':state.match=Math.max(0,state.match-1);break;case'issues':state.issues=!state.issues;break;case'reopen':state.source=state.source==='confirm'?'exists':state.source;go(1);toast('恢复节目首页；没有启动弹窗。');return;case'undo-queue':if(state.removed){state.queue.splice(state.removed.index,0,state.removed.name);state.removed=null}break;case'appearance-note':toast('文字大小、浅深色的细节留到视觉稿。');return;case'about':toast('我的播客 · 基于 AntennaPod · GPL-3.0。');return;case'rss-note':toast('此处进入保留的 RSS 功能页面；本稿只审阅入口层级。');return;case'seek-back':case'seek-forward':toast('保留原播放器快退 / 快进。');return;case'reset':try{localStorage.removeItem('mypodcasts-wireframe-source')}catch(e){}location.reload();return}refresh()});
document.addEventListener('input',event=>{const e=event.target;if(e.dataset.input==='episode-search'){state.query=e.value;document.getElementById('programmeRows').innerHTML=programmeRows()}if(e.dataset.input==='transcript-search'){state.keyword=e.value;state.match=0;const start=e.selectionStart;refresh([5]);const replacement=document.querySelector('[data-input="transcript-search"]');replacement.focus();replacement.setSelectionRange(start,start)}if(e.dataset.input==='import-progress'){state.progress=Number(e.value);refresh([6])}});
document.addEventListener('change',event=>{const e=event.target;if(e.dataset.select){state[e.dataset.select]=e.value;toast(e.dataset.select==='speed'?'倍速：'+e.value+'×':'睡眠定时：'+e.value)}});
render();
</script></body></html>
